name: Desplegar frontend a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "migracion-nodejs/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: migracion-nodejs/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: migracion-nodejs/frontend
        run: npm ci

      - name: Compilar
        working-directory: migracion-nodejs/frontend
        env:
          # URL pública del backend en Render (API + puerto /api del Express).
          VITE_API_URL: https://sistema-de-gestion-de-tramites-del.onrender.com/api
          # GitHub Pages sirve este repo en /<nombre-del-repo>/, no en la raíz.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: migracion-nodejs/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
